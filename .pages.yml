          label: 湿原
        - name: wildlife
          label: 野生動物
        - name: observatory
          label: 展望
    - name: subjects
      label: この場所で狙える被写体・撮影テーマ
      type: object
      list:
        collapsible:
          collapsed: true
          summary: '{id} / {note}'
      description: 「被写体で探す」の絞り込み対象になります。複数登録できます。
      fields:
      - name: id
        label: 被写体・撮影テーマ
        type: select
        required: true
        options:
          values:
          - name: otter
            label: ラッコ
          - name: crane
            label: タンチョウ
          - name: wild-birds
            label: 野鳥
          - name: ezo-deer
            label: エゾシカ
          - name: flowers
            label: 花・湿原
          - name: coast
            label: 海・岬
          - name: pasture
            label: 牧草地・酪農景観
          - name: sunset
            label: 夕景
          - name: sunrise
            label: 朝景
          - name: stars
            label: 星空
      - name: note
        label: この場所での補足
        type: string
        description: 例 岬・灯台・海岸風景、朝に野鳥を狙いやすい等
    - name: features
      label: 条件
      type: select
      options:
        multiple: true
        values:
        - name: beginner
          label: 初心者向け
        - name: parking
          label: 駐車場あり
    - name: bestSeason
      label: おすすめ時期
      type: string
    - name: parking
      label: 駐車場
      type: string
    - name: toilet
      label: トイレ
      type: string
    - name: cautions
      label: 注意事項・マナー
      type: string
      list: true
    - name: lat
      label: 緯度
      type: number
      required: true
    - name: lng
      label: 経度
      type: number
      required: true
    - name: positionOverride
      label: イラストMAP位置の手動補正
