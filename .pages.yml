          label: 野生動物
        - name: observatory
          label: 展望
    - name: subjects
      label: この場所で狙える被写体・撮影テーマ
      type: object
      list:
        collapsible:
          collapsed: true
          summary: '{id} / {note}'
      description: 「被写体で探す」の絞り込み対象になります。複数登録できます。
      fields:
      - name: id
        label: 被写体・撮影テーマ
        type: select
        required: true
        options:
          values:
          - name: otter
            label: ラッコ
          - name: crane
            label: タンチョウ
          - name: wild-birds
            label: 野鳥
          - name: ezo-deer
            label: エゾシカ
          - name: flowers
            label: 花・湿原
          - name: coast
            label: 海・岬
          - name: pasture
            label: 牧草地・酪農景観
          - name: sunset
            label: 夕景
          - name: sunrise
            label: 朝景
          - name: stars
            label: 星空
      - name: note
        label: この場所での補足
        type: string
        description: 例 岬・灯台・海岸風景、朝に野鳥を狙いやすい等
    - name: features
      label: 条件
      type: select
      options:
        multiple: true
        values:
        - name: beginner
          label: 初心者向け
        - name: parking
          label: 駐車場あり
    - name: bestSeason
      label: おすすめ時期
      type: string
    - name: bestTime
      label: おすすめ時間
      type: string
    - name: access
      label: アクセス
      type: string
    - name: position
      label: MAP位置（x,y）
      type: string
      description: 座標選択ツール https://hamanaka-photo.github.io/hamanaka-photo/map-coordinate-picker.html?v=63 で位置を選び、「座標をコピー」を押した後、この欄へ Ctrl+V してください。座標は100×100グリッドのセル番号です。例 63,71
      pattern:
        regex: ^(100|[1-9][0-9]?),(100|[1-9][0-9]?)$
        message: 1〜100の範囲で x,y の形式で入力してください。座標は100×100グリッドのセル番号です。例 63,71
    - name: x
      label: 旧MAP横位置
      type: number
      hidden: true
    - name: y
      label: 旧MAP縦位置
      type: number
      hidden: true
    - name: detailUrl
      label: Google Map URL
      type: string
      description: Google Mapsでこのスポットを開くURLを入力します。未入力の場合は「Google Mapで開く」リンクを表示しません。
