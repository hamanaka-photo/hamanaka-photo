      type: string
    - name: photo
      label: 顔写真
      type: image
      required: true
      description: profile.webp（800×800px前後）を推奨します。
      options:
        media: photographer_sonehara_images
        extensions:
        - jpg
        - jpeg
        - png
        - webp
        rename: false
    - name: profile
      label: プロフィール
      type: text
    - name: socialLinks
      label: SNS・関連リンク
      type: object
      description: 最大3件。画像は link01.webp、link02.webp、link03.webp の命名を推奨します。
      list:
        max: 3
        collapsible:
          collapsed: true
          summary: '{platform} / {account}'
      fields:
      - name: platform
        label: 種類
        type: select
        required: true
        options:
          values:
          - name: instagram
            label: Instagram
          - name: x
            label: X
          - name: facebook
            label: Facebook
          - name: website
            label: Webサイト
          - name: other
            label: その他
      - name: account
        label: 表示名・アカウント名
        type: string
        required: true
      - name: image
        label: QRコード・画像
        type: image
        required: true
        options:
          media: photographer_sonehara_images
          extensions:
          - jpg
          - jpeg
          - png
          - webp
          rename: false
      - name: url
        label: リンク先URL
        type: string
        required: true
  - name: photographer_hamanaka
    label: 浜中 太郎
    type: file
    path: data/photographers/hamanaka.json
    format: json
    operations:
      delete: false
    fields:
    - name: name
      label: 氏名
      type: string
