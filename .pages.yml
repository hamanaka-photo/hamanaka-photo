media:
  - name: images
    label: 画像
    input: assets/images
    output: assets/images
    extensions: [jpg, jpeg, png, webp]
    rename: false

content:

  - name: selections
    label: フォトセレクション
    type: file
    path: data/selections.json
    format: json
    list: true
    operations:
      delete: false

    fields:

      - name: id
        label: セレクションID
        type: string
        required: true
        description: 半角英数字とハイフンで入力します。例 tokyo-camera-club-2026

      - name: status
        label: 公開状態
        type: select
        required: true
        options:
          values:
            - name: current
              label: CURRENT 現在のセレクション
            - name: past
              label: PAST 過去のセレクション

      - name: year
        label: 年
        type: string
        required: true

      - name: title
        label: セレクションタイトル
        type: string
        required: true

      - name: shortTitle
        label: HOME表示用タイトル
        type: string
        required: true

      - name: description
        label: 紹介文
        type: text

      - name: cover
        label: カバー画像
        type: image
        required: true
        options:
          media: images
          extensions: [jpg, jpeg, png, webp]
          rename: false

      - name: works
        label: 掲載作品
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{title}"
        fields:

          - name: id
            label: 作品番号
            type: number
            required: true

          - name: title
            label: 作品タイトル
            type: string
            required: true

          - name: image
            label: 作品画像
            type: image
            required: true
            options:
              media: images
              extensions: [jpg, jpeg, png, webp]
              rename: false

          - name: location
            label: 撮影地
            type: string

          - name: season
            label: 撮影時期
            type: string

          - name: camera
            label: カメラ
            type: string

          - name: lens
            label: レンズ
            type: string

          - name: settings
            label: 撮影設定
            type: string

          - name: author
            label: 撮影者
            type: string

          - name: comment
            label: 作品コメント
            type: text


  - name: photographers
    label: 撮影者
    type: file
    path: data/photographers.json
    format: json
    list: true
    operations:
      delete: false

    fields:

      - name: name
        label: 氏名
        type: string
        required: true

      - name: nameEn
        label: 英字表記
        type: string

      - name: photo
        label: 顔写真
        type: image
        options:
          media: images
          extensions: [jpg, jpeg, png, webp]
          rename: false

      - name: works
        label: Took photos
        type: string

      - name: profile
        label: プロフィール
        type: text


  - name: news
    label: お知らせ
    type: file
    path: data/news.json
    format: json
    list: true
    operations:
      delete: false

    fields:

      - name: date
        label: 日付
        type: date
        required: true

      - name: category
        label: カテゴリ
        type: select
        options:
          values:
            - お知らせ
            - 写真展
            - フォトガイド
            - イベント
            - フォトコンテスト

      - name: title
        label: タイトル
        type: string
        required: true

      - name: url
        label: リンク先
        type: string


settings:
  commit:
    templates:
      create: "CMS: {path} を追加"
      update: "CMS: {path} を更新"
      delete: "CMS: {path} を削除"