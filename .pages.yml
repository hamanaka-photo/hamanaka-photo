- name: photo_guide
  label: PHOTO GUIDE｜公開ページ編集
  type: group
  items:
  - name: photo_map_settings
    label: SPOT｜撮影スポットを探す
    type: file
    path: data/photo-map.json
    format: json
    operations:
      delete: false
    fields:
    - name: hero
      label: HERO｜撮影スポットを探す
      type: object
      fields:
      - name: eyebrow
        label: 英字見出し
        type: string
      - name: title
        label: タイトル
        type: string
        required: true
      - name: lead
        label: 説明文
        type: text
      - name: image
        label: ヒーロー画像
        type: image
        options:
          media: photo_map_images
          extensions:
          - jpg
          - jpeg
          - png
          - webp
          rename: false
    - name: map
      label: MAP｜地図画像
      type: object
      fields:
      - name: image
        label: 地図画像
        type: image
        description: ピンを重ねる浜中町の地図画像を登録します。
        options:
          media: photo_map_images
          extensions:
          - jpg
          - jpeg
          - png
          - webp
          rename: false
      - name: alt
        label: 地図画像の代替テキスト
        type: string
    - name: subjects
      label: FILTER｜被写体で探す
      type: object
      list:
        collapsible:
          collapsed: true
          summary: '{label}'
      description: 「被写体で探す」と「被写体別一覧」で使用する表示名・説明を設定します。
      fields:
      - name: id
        label: 被写体ID
        type: select
        required: true
        options:
          values:
          - name: otter
            label: ラッコ
          - name: crane
            label: タンチョウ
          - name: wild-birds
            label: 野鳥
          - name: ezo-deer
            label: エゾシカ
          - name: flowers
            label: 花・湿原
          - name: coast
            label: 海・岬
          - name: pasture
            label: 牧草地・酪農景観
          - name: sunset
            label: 夕景
          - name: sunrise
            label: 朝景
          - name: stars
            label: 星空
      - name: label
        label: 表示名
        type: string
        required: true
      - name: icon
        label: アイコン文字
        type: string
        description: 任意。1〜2文字程度の記号を推奨します。
      - name: description
        label: 説明
        type: string
        description: 被写体別一覧の見出し下に表示します。
    - name: coursesTitle
      label: MODEL COURSE｜見出し
      type: string
    - name: coursesNote
      label: MODEL COURSE｜共通注記
      type: text
    - name: courses
      label: MODEL COURSE｜モデルコース
      type: object
      list:
        max: 6
        collapsible:
          collapsed: true
          summary: '{title}'
      fields:
      - name: eyebrow
        label: 英字見出し
        type: string
      - name: title
        label: コース名
        type: string
        required: true
      - name: summary
        label: コース概要
        type: text
      - name: duration
        label: 所要時間
        type: string
        description: 例 約4時間
      - name: spotIds
        label: コース内のスポットID（表示順）
        type: string
        list: true
        description: photo-spots.jsonに登録済みのスポットIDを、巡る順に指定します。
    - name: manner
      label: PHOTO MANNER｜撮影マナー
      type: object
      fields:
      - name: eyebrow
        label: 英字見出し
        type: string
      - name: title
        label: 見出し
        type: string
      - name: text
        label: 説明
        type: text
      - name: buttonLabel
        label: ボタン表示
        type: string
      - name: url
        label: リンク先
        type: string
  - name: photo_spots
    label: SPOT｜撮影スポット
    type: file
    path: data/photo-spots.json
    format: json
    list: true
    operations:
      delete: true
    fields:
    - name: id
      label: スポットID
      type: string
      required: true
      pattern:
        regex: ^SPOT-[0-9]{3}$
        message: SPOT-013のように、SPOT-と3桁の数字で入力してください。
    - name: published
      label: 公開する
      type: boolean
      required: true
