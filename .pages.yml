media:
  - name: images
    label: 画像
    input: assets/images
    output: assets/images
    extensions: [jpg, jpeg, png, webp]
    rename: false

content:
  - name: gallery
    label: 展示作品
    type: file
    path: data/gallery.json
    format: json
    list: true
    operations:
      delete: false
    fields:
      - name: id
        label: 作品番号
        type: number
        required: true

      - name: title
        label: 作品タイトル
        type: string
        required: true

      - name: image
        label: 作品画像
        type: image
        required: true
        options:
          media: images
          extensions: [jpg, jpeg, png, webp]
          rename: false

      - name: location
        label: 撮影地
        type: string

      - name: season
        label: 撮影時期
        type: string

      - name: camera
        label: カメラ
        type: string

      - name: lens
        label: レンズ
        type: string

      - name: settings
        label: 撮影設定
        type: string

      - name: author
        label: 撮影者
        type: string

      - name: comment
        label: 作品コメント
        type: text

  - name: photographers
    label: 撮影者
    type: file
    path: data/photographers.json
    format: json
    list: true
    operations:
      delete: false
    fields:
      - name: name
        label: 氏名
        type: string
        required: true

      - name: nameEn
        label: 英字表記
        type: string

      - name: photo
        label: 顔写真
        type: image
        options:
          media: images
          extensions: [jpg, jpeg, png, webp]
          rename: false

      - name: works
        label: Took photos
        type: string

      - name: profile
        label: プロフィール
        type: text

  - name: news
    label: お知らせ
    type: file
    path: data/news.json
    format: json
    list: true
    operations:
      delete: false
    fields:
      - name: date
        label: 日付
        type: date
        required: true

      - name: category
        label: カテゴリ
        type: select
        options:
          values:
            - お知らせ
            - 写真展
            - フォトガイド
            - イベント
            - フォトコンテスト

      - name: title
        label: タイトル
        type: string
        required: true

      - name: url
        label: リンク先
        type: string

settings:
  commit:
    templates:
      create: "CMS: {path} を追加"
      update: "CMS: {path} を更新"
      delete: "CMS: {path} を削除"